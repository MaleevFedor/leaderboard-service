spring.application.name=leaderboard-service

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/leaderboard}
spring.datasource.username=${DATABASE_USERNAME:leaderboard}
spring.datasource.password=${DATABASE_PASSWORD:leaderboard}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info